<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Arya Downloader</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
:root{--paper:#faf8f3;--ink:#1b2a41;--mut:#6f7787;--line:#d9d4c7;--navy:#16325c;--navy2:#0f2444;--accent:#2a5fb8;--err:#a62b2b}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:Georgia,"Times New Roman",serif;background:var(--paper);color:var(--ink);
  min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;overflow-x:hidden}
  
.top{border-bottom:1px solid var(--line);background:#fff;padding-top:env(safe-area-inset-top)}
.top-in{max-width:720px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:10px}
.logo{width:36px;height:36px;border-radius:6px;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.9rem;letter-spacing:1px;overflow:hidden;flex-shrink:0;font-family:'Plus Jakarta Sans',sans-serif;}
.logo img{width:100%;height:100%;object-fit:cover;display:block}
.brand{font-family:'Plus Jakarta Sans',sans-serif;font-weight:800;font-size:1.05rem;color:var(--navy)}

.btn-support{margin-left:auto;background:var(--paper);border:1px solid var(--line);color:var(--navy);padding:8px 14px;border-radius:20px;font-family:'Plus Jakarta Sans',sans-serif;font-size:.8rem;font-weight:700;text-decoration:none;display:flex;align-items:center;gap:6px;transition:0.2s;}
.btn-support:hover{background:var(--navy);color:#fff;border-color:var(--navy);}
.btn-support i{color:#e11d48;transition:0.2s;}
.btn-support:hover i{color:#fff;}

main{flex:1;width:100%;max-width:560px;margin:0 auto;padding:clamp(20px,5vh,48px) 16px 20px}
h1{font-family:'Plus Jakarta Sans',sans-serif;font-weight:800;font-size:clamp(1.6rem,7vw,2.2rem);text-align:center;color:var(--navy);line-height:1.2;letter-spacing:-0.5px;}
.rule{width:56px;height:3px;background:var(--accent);margin:12px auto;border-radius:2px;}
.lead{font-family:'Plus Jakarta Sans',sans-serif;text-align:center;color:var(--mut);font-size:.9rem;font-weight:400;margin-bottom:22px;line-height:1.5;}

.box{background:#fff;border:1px solid var(--line);border-radius:6px;padding:16px;box-shadow:0 2px 0 var(--line)}
label{display:block;font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin-bottom:8px;font-family:'Plus Jakarta Sans',sans-serif;font-weight:600;}
.row{display:flex;gap:8px}
input{flex:1;min-width:0;padding:12px 13px;border:1px solid var(--line);border-radius:4px;background:#fff;color:var(--ink);font-size:16px;font-family:'Plus Jakarta Sans',sans-serif;outline:none;transition:0.2s;}
input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(42,95,184,0.1);}
#cari{padding:0 20px;border:0;border-radius:4px;background:var(--navy);color:#fff;font-size:.95rem;font-weight:700;cursor:pointer;font-family:'Plus Jakarta Sans',sans-serif;transition:0.2s;min-width:80px;display:flex;align-items:center;justify-content:center;}
#cari:hover{background:var(--navy2)}
#cari:disabled{opacity:.7;cursor:not-allowed;}
.mini{margin-top:10px;background:none;border:0;color:var(--accent);font-size:.82rem;cursor:pointer;font-family:'Plus Jakarta Sans',sans-serif;font-weight:600;padding:0;display:flex;align-items:center;gap:5px;}
.mini:hover{text-decoration:underline}

/* CSS Animasi Spinner */
.spinner{display:inline-block;width:1em;height:1em;border:2px solid rgba(255,255,255,0.3);border-radius:50%;border-top-color:#fff;animation:spin 0.8s linear infinite;}
@keyframes spin { to { transform: rotate(360deg); } }

.sup{margin-top:12px;font-size:.8rem;color:var(--mut);text-align:center;line-height:1.6;font-family:'Plus Jakarta Sans',sans-serif;font-weight:600;}
.sup i{margin:0 3px;color:var(--navy)}

#status{display:none;margin-top:14px;font-size:.88rem;padding:10px 12px;border-left:3px solid var(--accent);background:#f0f4fb;color:var(--navy);font-family:'Plus Jakarta Sans',sans-serif;border-radius:0 4px 4px 0;display:flex;align-items:center;gap:8px;}
#status.err{border-left-color:var(--err);background:#fbefef;color:var(--err)}
#hasil{display:none;margin-top:16px;border-top:1px solid var(--line);padding-top:16px;font-family:'Plus Jakarta Sans',sans-serif;}

.info{margin-bottom: 16px;}
.judul{font-weight:700;font-size:1rem;color:var(--navy);word-break:break-word;}
.src{color:var(--mut);font-size:.85rem;margin-top:4px;font-weight:500;}

.slider-wrapper { position: relative; background: #000; border-radius: 8px; overflow: hidden; margin-bottom: 12px; display: flex; align-items: center; justify-content: center; min-height: 200px; }
.slider { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; scroll-behavior: smooth; width: 100%; aspect-ratio: 16/9; max-height: 350px; -ms-overflow-style: none; scrollbar-width: none; }
.slider::-webkit-scrollbar { display: none; }
.slide { flex: 0 0 100%; scroll-snap-align: center; display: flex; justify-content: center; align-items: center; }
.slide img, .slide video { width: 100%; height: 100%; object-fit: contain; }

.dots { display: flex; justify-content: center; gap: 6px; margin-bottom: 16px; flex-wrap: wrap; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: #ccc; transition: 0.2s; cursor:pointer;}
.dot.active { background: var(--accent); transform: scale(1.3); }

.action-group { display: flex; flex-direction: column; gap: 8px; }
.dl{width: 100%; padding:12px 16px;border:1px solid var(--navy);border-radius:6px;background:var(--navy);color:#fff;font-weight:700;font-size:.95rem;cursor:pointer;font-family:'Plus Jakarta Sans',sans-serif;text-align:center;display:flex;align-items:center;justify-content:center;gap:8px;transition:0.2s;}
.dl:hover{background:var(--navy2)}
.dl.alt{background:#fff;color:var(--navy)}
.dl.alt:hover{background:#f0f4fb}
.dl:disabled{opacity:.55;cursor:not-allowed;}
.dl-all{background:#22c55e; border-color:#22c55e;}
.dl-all:hover{background:#16a34a;}

footer{border-top:1px solid var(--line);background:#fff;text-align:center;color:var(--mut);font-size:.85rem; padding:16px 16px calc(18px + env(safe-area-inset-bottom));font-family:'Plus Jakarta Sans',sans-serif;}
.by{margin-top:2px}
.by b{color:var(--navy)}
.social{display:flex;gap:12px;justify-content:center;margin-top:10px}
.social a{width:36px;height:36px;border:1px solid var(--line);border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--navy);font-size:.95rem;text-decoration:none;transition:.2s}
.social a:hover{background:var(--navy);border-color:var(--navy);color:#fff}
@media(max-height:700px){.lead{margin-bottom:16px}.rule{margin:8px auto}}
</style>
</head>
<body>

<div class="top">
  <div class="top-in">
    <div class="logo" id="logo">AD</div>
    <span class="brand">Arya Downloader</span>
    <a href="https://files.catbox.moe/91urf1.jpg" target="_blank" class="btn-support">
      <i class="fa-solid fa-heart"></i> Support
    </a>
  </div>
</div>

<main>
  <h1>Unduh dengan mudah</h1>
  <div class="rule"></div>
  <p class="lead">TikTok, Instagram & YouTube dalam 1 platform.<br>Tempel tautan, unduh seketika!</p>

  <div class="box">
    <label for="url">Tautan</label>
    <div class="row">
      <input id="url" type="url" placeholder="https://..." autocomplete="off">
      <button id="cari">Cari</button>
    </div>
    <button class="mini" id="tempel"><i class="fa-solid fa-paste"></i> Tempel dari clipboard</button>
    <div id="status"></div>
    <div id="hasil"></div>
  </div>

  <p class="sup">
    <i class="fa-brands fa-tiktok"></i> TikTok
    &nbsp;·&nbsp; <i class="fa-brands fa-instagram"></i> Instagram
    &nbsp;·&nbsp; <i class="fa-brands fa-youtube"></i> YouTube
    <br><span style="font-size:0.75rem;opacity:0.7">Semua platform siap digunakan.</span>
  </p>
</main>

<footer>
  <div>© Arya Downloader</div>
  <div class="by">by <b id="owner">Arya</b></div>
  <div class="social" id="social"></div>
</footer>

<script>
// ====== KONFIGURASI ======
const LOGO_URL = "https://files.catbox.moe/3h7rom.jpg";            
const OWNER = "Arya";           
const SOCIAL = [                
  { icon:"fa-brands fa-instagram", title:"Instagram",        url:"https://instagram.com/adfayafathinarya" },
  { icon:"fa-brands fa-tiktok",    title:"TikTok",           url:"https://tiktok.com/@adfayafathinarya09" },
  { icon:"fa-brands fa-whatsapp",  title:"Saluran WhatsApp", url:"https://whatsapp.com/channel/0029Vb94ZxHBadmday3k9Q0I" }
];

const PROVIDERS = {
  tiktok: { label:"TikTok", match:/(^|\.)tiktok\.com$/i, get: tiktokGet },
  instagram: { label:"Instagram", match:/(^|\.)(instagram\.com|instagr\.am)$/i, get: instagramGet },
  youtube: { label:"YouTube", match:/(^|\.)(youtube\.com|youtu\.be)$/i, get: youtubeGet }
};

// --- FUNGSI TIKTOK ---
async function tiktokGet(url){
  const r = await fetch("https://www.tikwm.com/api/?hd=1&url=" + encodeURIComponent(url));
  const j = await r.json();
  if(j.code !== 0 || !j.data) throw new Error(j.msg || "Konten TikTok tidak ditemukan.");
  const d = j.data, base = "https://www.tikwm.com";
  const abs = u => !u ? "" : (u.startsWith("http") ? u : base + u);
  const out = {
    title: d.title || "TikTok",
    author: d.author && d.author.nickname ? "@" + d.author.nickname : "",
    videos:[], audios:[], photos:[]
  };
  if(d.hdplay) out.videos.push({label:"Video HD", url:abs(d.hdplay), name:"tiktok-hd.mp4"});
  if(d.play)   out.videos.push({label:"Video SD", url:abs(d.play),   name:"tiktok-sd.mp4"});
  if(d.music)  out.audios.push({label:"Audio MP3", url:abs(d.music), name:"tiktok-audio.mp3"});
  (d.images||[]).forEach((u,i)=> out.photos.push({url:u, name:`tiktok-foto-${i+1}.jpg`}));
  return out;
}

// --- FUNGSI INSTAGRAM ---
async function instagramGet(url){
  const apiKey = "RS-JF%23yBr7m"; 
  const targetApi = `https://api.nexadev.my.id/api/ig?url=${encodeURIComponent(url)}&apikey=${apiKey}`;

  const proxies = [
    `https://proxy.corsfix.com/?${targetApi}`, 
    `https://api.cors.lol/?url=${encodeURIComponent(targetApi)}`,
    `https://api.codetabs.com/v1/proxy/?quest=${encodeURIComponent(targetApi)}`,
    targetApi 
  ];

  let data = null;
  let success = false;

  for (let p of proxies) {
    try {
      const res = await fetch(p);
      if (!res.ok) continue;
      const json = await res.json();
      if (json.status === true || (json.data && json.data.length > 0)) {
        data = json;
        success = true;
        break;
      }
    } catch (e) {}
  }

  if (!success || !data) throw new Error("Gagal mengambil data Instagram. Postingan private atau server sibuk.");
  
  const mediaList = data.data || [];
  if (mediaList.length === 0) throw new Error("Tidak ada media ditemukan.");

  const out = {
    title: "Postingan Instagram",
    author: data.author || "Instagram User",
    videos: [], audios: [], photos: []
  };

  mediaList.forEach((item, i) => {
    if (item.type === 'mp4' || (item.url && item.url.includes('.mp4'))) {
      out.videos.push({ label: `Video ${i+1}`, url: item.url, name: `ig-video-${i+1}.mp4` });
    } else {
      out.photos.push({ url: item.url, name: `ig-foto-${i+1}.jpg` });
    }
  });

  return out;
}

// --- FUNGSI YOUTUBE (FIXED TANPA API KEY) ---
async function youtubeGet(url){
  const encUrl = encodeURIComponent(url);
  
  // Sesuai curl: TANPA API Key untuk YouTube
  const vidTarget = `https://api.nexadev.my.id/api/ytmp4?url=${encUrl}&type=video&quality=720p`;
  const audTarget = `https://api.nexadev.my.id/api/ytmp3?url=${encUrl}`;

  const proxies = [
    (u) => u, // Direct
    (u) => `https://proxy.corsfix.com/?${u}`,
    (u) => `https://api.cors.lol/?url=${encodeURIComponent(u)}`,
    (u) => `https://api.codetabs.com/v1/proxy/?quest=${encodeURIComponent(u)}`
  ];

  const fetchWithProxy = async (target, label) => {
    for (let i = 0; i < proxies.length; i++) {
      let p = proxies[i];
      let proxyName = i === 0 ? "Direct" : `Proxy ${i}`;
      try {
        status(`Mengambil ${label} via ${proxyName}...`);
        const res = await fetch(p(target));
        if (!res.ok) continue;
        const text = await res.text();
        const json = JSON.parse(text);
        if (json.status === true || (json.data && json.data.url) || (json.url)) return json;
      } catch(e) {}
    }
    return null;
  };

  const [vidData, audData] = await Promise.all([
    fetchWithProxy(vidTarget, "Video"),
    fetchWithProxy(audTarget, "Audio")
  ]);

  if (!vidData) throw new Error("Gagal mengambil video. Link mungkin private atau server API down.");

  const out = {
    title: vidData.title || vidData.data?.title || "Video YouTube",
    author: vidData.author || vidData.data?.author || "YouTube Channel",
    videos: [], audios: [], photos: []
  };

  const vUrl = vidData.url || vidData.data?.url;
  const vName = vidData.filename || vidData.data?.filename || "youtube-video.mp4";
  if (vUrl) out.videos.push({ label: "Video (MP4)", url: vUrl, name: vName });

  if (audData) {
    const aUrl = audData.url || audData.data?.url;
    const aName = audData.filename || audData.data?.filename || "youtube-audio.mp3";
    if (aUrl) out.audios.push({ label: "Audio (MP3)", url: aUrl, name: aName });
  }

  return out;
}

// --- LOGIKA UTAMA ---
const $ = s => document.querySelector(s);
const esc = s => String(s||"").replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

if(LOGO_URL){
  const img = new Image(); img.alt = "Logo";
  img.onload = ()=>{ $("#logo").textContent = ""; $("#logo").appendChild(img); };
  img.src = LOGO_URL;
}
$("#owner").textContent = OWNER;
$("#social").innerHTML = SOCIAL.filter(s=>s.url).map(s=>
  `<a href="${esc(s.url)}" target="_blank" rel="noopener"><i class="${esc(s.icon)}"></i></a>`).join("");

function deteksi(url){
  let host; try{ host = new URL(url).hostname; }catch(e){ return null; }
  for(const k in PROVIDERS) if(PROVIDERS[k].match.test(host)) return k;
  return null;
}
function status(t, err){
  const s = $("#status");
  s.innerHTML = t ? (err ? t : `<div class="spinner" style="border-top-color:var(--navy);"></div> ${t}`) : ""; 
  s.className = err ? "err" : "";
  s.style.display = t ? "flex" : "none";
}

$("#cari").onclick = cari;
$("#url").addEventListener("keydown", e=>{ if(e.key==="Enter") cari(); });
$("#tempel").onclick = async ()=>{
  try{ $("#url").value = await navigator.clipboard.readText(); }
  catch(e){ status("Izin clipboard ditolak.", true); }
};

async function cari(){
  const url = $("#url").value.trim();
  $("#hasil").style.display = "none";
  if(!/^https?:\/\//i.test(url)) return status("Masukkan tautan yang valid.", true);
  const key = deteksi(url);
  if(!key) return status("Tautan belum didukung.", true);

  const btn = $("#cari");
  btn.disabled = true;
  btn.innerHTML = `<div class="spinner"></div>`;
  
  status("Mendeteksi tautan " + PROVIDERS[key].label + "...");
  try{
    const d = await PROVIDERS[key].get(url);
    if(!d.videos.length && !d.audios.length && !d.photos.length) throw new Error("Tidak ada media yang bisa diunduh.");
    tampil(d, PROVIDERS[key].label);
    status(""); // Hilangkan status jika sukses
  }catch(e){
    status(e.message || "Gagal memproses tautan.", true);
  }finally{ 
    btn.disabled = false; 
    btn.innerHTML = "Cari";
  }
}

let currentIndex = 0;
let sliderMedia = []; 
let audioData = null;

function tampil(d, platform){
  let h = `<div class="info">
    <div class="judul">${esc(d.title)}</div>
    <div class="src">${esc(platform)} • ${esc(d.author)}</div>
  </div>`;

  sliderMedia = [];
  d.videos.forEach(v => sliderMedia.push({type:'video', ...v}));
  d.photos.forEach(p => sliderMedia.push({type:'foto', ...p}));
  audioData = d.audios.length > 0 ? d.audios[0] : null; 

  if (sliderMedia.length > 0) {
    h += `<div class="slider-wrapper"><div class="slider" id="mediaSlider">`;
    
    sliderMedia.forEach(item => {
      if(item.type === 'video') {
        h += `<div class="slide"><video controls src="${item.url}"></video></div>`;
      } else if (item.type === 'foto') {
        h += `<div class="slide"><img src="${item.url}" referrerpolicy="no-referrer" loading="lazy"></div>`;
      }
    });
    h += `</div></div>`;

    if (sliderMedia.length > 1) {
      h += `<div class="dots" id="dotsContainer">`;
      sliderMedia.forEach((_, i) => { h += `<div class="dot ${i===0?'active':''}"></div>`; });
      h += `</div>`;
    }

    h += `<div class="action-group">`;
    h += `<button class="dl" id="btnDlCurrent">Unduh Media 1</button>`;
    
    if (sliderMedia.length > 1) {
      h += `<button class="dl dl-all" onclick="unduhSemua()">Unduh Semua (${sliderMedia.length})</button>`;
    }
    
    if (audioData) {
      h += `<button class="dl alt" onclick="unduhUrl('${audioData.url}', '${audioData.name}')"><i class="fa-solid fa-music"></i> Unduh Audio (MP3)</button>`;
    }
    
    h += `</div>`;
  }

  const box = $("#hasil");
  box.innerHTML = h; 
  box.style.display = "block";
  
  const slider = document.getElementById('mediaSlider');
  if (slider) {
    currentIndex = 0;
    updateDownloadButton();
    
    slider.addEventListener('scroll', () => {
      const index = Math.round(slider.scrollLeft / slider.clientWidth);
      if (index !== currentIndex) {
        currentIndex = index;
        const dots = document.querySelectorAll('.dot');
        dots.forEach((d, i) => d.classList.toggle('active', i === index));
        updateDownloadButton();
      }
    });
  }
}

function updateDownloadButton() {
  const btn = document.getElementById('btnDlCurrent');
  if (!btn) return;
  const item = sliderMedia[currentIndex];
  
  if(item) {
    if (item.type === 'video') {
      btn.innerHTML = `<i class="fa-solid fa-video"></i> Unduh Video`;
    } else {
      btn.innerHTML = `<i class="fa-solid fa-image"></i> Unduh Foto ${currentIndex + 1}`;
    }
    btn.onclick = () => unduhUrl(item.url, item.name);
  }
}

async function unduhUrl(url, name) {
  try {
    const r = await fetch(url);
    if(!r.ok) throw new Error();
    const blob = await r.blob();
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = name || "unduhan";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href), 4000);
  } catch(e) {
    window.open(url, "_blank");
  }
}

async function unduhSemua() {
  const total = sliderMedia.length;
  for(let i=0; i<total; i++) {
    const item = sliderMedia[i];
    setTimeout(() => { unduhUrl(item.url, item.name); }, i * 500);
  }
}
</script>
</body>
</html>
